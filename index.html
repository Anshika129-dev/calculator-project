<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            width: 20%;
            margin: auto;
            box-shadow: 0 0 5px grey;
            padding: 10px;
            border-radius: 5px;
            background-color: black;
        }

        .input {
            width: 90%;
            padding: 5px;
            outline: none;
            text-align: right;
            background-color: rgb(252, 251, 250);
            border: 0;
            border-radius: 5px;
            font-size: 15px;
            font-weight: bold;
        }

        .buttons {
            padding: 10px;
            gap: 10px;
            display: flex;
            flex-wrap: wrap;
            cursor: pointer;
        }

        .btn {
            height: 40px;
            width: 40px;
            background-color: white;
            color: black;
            border-radius: 20%;
            border: 0;
            box-shadow: 1px 0 1px rgb(235, 106, 66);
        }

        .box {
            height: 100px;
            width: 100px;
            border: 1px solid;
            box-shadow: 5px 5px 3px grey;
        }

        body {
            background-color: rgb(150, 127, 127);
        }

        .container {
            text-align: center;
            color: white;
            padding: 5px;
        }

        .ope {
            background-color: rgb(194, 105, 32);
        }

        .equal {
            background-color: rgb(6, 233, 6);
            color: white;
        }

        .cc {
            background-color: rgb(231, 13, 42);
            color: white;
        }

        .base {
            text-align: center;
            color: white;
            font-size: small;
        }

        .del {
            background-color: rgb(250, 250, 244);
            color: rgb(12, 10, 10);
        }
    </style>
</head>

<body>
    <div class="container">
        <i class="fa fa-calculator" style="color: white;">Calculator</i>
        <div class="input">
            <input type="text" placeholder="0" class="input">
        </div>
        <div class="buttons">
            <button class="btn cc">C</button>
            <button class="btn del"><i class="fa fa-close"></i></button>
            <button class="btn ope">%</button>
            <button class="btn ope">/</button>
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn ope">*</button>
            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn ope">-</button>
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn ope">+</button>
            <button class="btn zero">0</button>
            <button class="btn ">.</button>
            <button class="btn equal">=</button>
        </div>
        <div>
            <i class="base">Basic Calculator UI</i>
        </div>



    </div>
</body>

</html>
